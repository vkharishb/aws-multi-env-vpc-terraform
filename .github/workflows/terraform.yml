name: Terraform Workflow

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

      environment:
        description: Terraform environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      confirm_destroy:
        description: Type DESTROY-dev or DESTROY-prod
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    terraform-${{
      inputs.environment
      || (
        github.event_name == 'pull_request'
        && github.base_ref == 'main'
        && 'prod'
      )
      || (
        github.ref_name == 'main'
        && 'prod'
      )
      || 'dev'
    }}
  cancel-in-progress: false

jobs:
  resolve-context:
    name: Resolve Terraform Context
    runs-on: ubuntu-latest

    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      working_directory: ${{ steps.resolve.outputs.working_directory }}
      should_apply: ${{ steps.resolve.outputs.should_apply }}
      plan_artifact: ${{ steps.resolve.outputs.plan_artifact }}
      destroy_artifact: ${{ steps.resolve.outputs.destroy_artifact }}

    steps:
      - name: Resolve Environment and Action
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_ENVIRONMENT="$INPUT_ENVIRONMENT"
          elif [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            TARGET_ENVIRONMENT="prod"
          elif [[ "$REF_NAME" == "main" ]]; then
            TARGET_ENVIRONMENT="prod"
          else
            TARGET_ENVIRONMENT="dev"
          fi

          case "$TARGET_ENVIRONMENT" in
            dev|prod)
              ;;
            *)
              echo "::error::Invalid environment: $TARGET_ENVIRONMENT"
              exit 1
              ;;
          esac

          SHOULD_APPLY="false"

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            SHOULD_APPLY="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_ACTION" == "apply" ]]; then
            SHOULD_APPLY="true"
          fi

          echo "target_environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "working_directory=terraform/env/$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "should_apply=$SHOULD_APPLY" >> "$GITHUB_OUTPUT"
          echo "plan_artifact=terraform-plan-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "destroy_artifact=terraform-destroy-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Working directory: terraform/env/$TARGET_ENVIRONMENT"
          echo "Apply after approval: $SHOULD_APPLY"

  terraform-plan:
    name: Terraform Plan
    needs:
      - resolve-context

    if: >-
      ${{
        github.event_name != 'workflow_dispatch'
        || inputs.action != 'destroy'
      }}

    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_WORKING_DIR: ${{ needs.resolve-context.outputs.working_directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -no-color

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=tfplan

      - name: Display Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      - name: Create Plan Checksum
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum tfplan > tfplan.sha256

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-context.outputs.plan_artifact }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: Approval and Terraform Apply
    needs:
      - resolve-context
      - terraform-plan

    if: >-
      ${{
        needs.terraform-plan.result == 'success'
        && needs.resolve-context.outputs.should_apply == 'true'
      }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve-context.outputs.target_environment }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_WORKING_DIR: ${{ needs.resolve-context.outputs.working_directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -no-color

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-context.outputs.plan_artifact }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum -c tfplan.sha256

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            tfplan

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    needs:
      - resolve-context

    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        && inputs.action == 'destroy'
      }}

    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_WORKING_DIR: ${{ needs.resolve-context.outputs.working_directory }}
      EXPECTED_CONFIRMATION: DESTROY-${{ needs.resolve-context.outputs.target_environment }}

    steps:
      - name: Validate Destroy Confirmation
        shell: bash
        env:
          PROVIDED_CONFIRMATION: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail

          if [[ "$PROVIDED_CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]]; then
            echo "::error::Invalid destroy confirmation."
            echo "Enter exactly: $EXPECTED_CONFIRMATION"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: terraform-destroy-plan-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -no-color

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=destroy.tfplan

      - name: Display Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color destroy.tfplan

      - name: Create Destroy Plan Checksum
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum destroy.tfplan > destroy.tfplan.sha256

      - name: Upload Terraform Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-context.outputs.destroy_artifact }}
          path: |
            ${{ env.TF_WORKING_DIR }}/destroy.tfplan
            ${{ env.TF_WORKING_DIR }}/destroy.tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  terraform-destroy:
    name: Approval and Terraform Destroy
    needs:
      - resolve-context
      - terraform-destroy-plan

    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        && inputs.action == 'destroy'
        && needs.terraform-destroy-plan.result == 'success'
      }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve-context.outputs.target_environment }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_WORKING_DIR: ${{ needs.resolve-context.outputs.working_directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -no-color

      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-context.outputs.destroy_artifact }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum -c destroy.tfplan.sha256

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            destroy.tfplan