name: Terraform Apply

on:
  workflow_run:
    workflows:
      - Terraform Plan
    types:
      - completed

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  resolve-context:
    name: Resolve Apply Context

    # Apply only successful push/manual plans.
    # Pull-request plans are review-only and must never apply.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest

    outputs:
      target_environment: ${{ steps.context.outputs.target_environment }}
      working_directory: ${{ steps.context.outputs.working_directory }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}

    steps:
      - name: Resolve environment
        id: context
        shell: bash
        env:
          PLAN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PLAN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "${PLAN_BRANCH}" == "main" ]]; then
            TARGET_ENVIRONMENT="prod"
          else
            TARGET_ENVIRONMENT="dev"
          fi

          WORKING_DIRECTORY="terraform/env/${TARGET_ENVIRONMENT}"
          ARTIFACT_NAME="terraform-plan-${TARGET_ENVIRONMENT}"

          echo "target_environment=${TARGET_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "working_directory=${WORKING_DIRECTORY}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${PLAN_SHA}" >> "${GITHUB_OUTPUT}"

          echo "Plan branch: ${PLAN_BRANCH}"
          echo "Plan commit: ${PLAN_SHA}"
          echo "Environment: ${TARGET_ENVIRONMENT}"
          echo "Artifact: ${ARTIFACT_NAME}"

  terraform-apply:
    name: Apply Terraform - ${{ needs.resolve-context.outputs.target_environment }}
    needs:
      - resolve-context

    runs-on: ubuntu-latest

    concurrency:
      group: terraform-apply-${{ needs.resolve-context.outputs.target_environment }}
      cancel-in-progress: false

    # dev can run without reviewers.
    # Configure required reviewers for the prod environment.
    environment:
      name: ${{ needs.resolve-context.outputs.target_environment }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_WORKING_DIR: ${{ needs.resolve-context.outputs.working_directory }}

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-context.outputs.checkout_ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: terraform-apply-${{ needs.resolve-context.outputs.target_environment }}-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -reconfigure

      - name: Download saved Terraform Plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.resolve-context.outputs.artifact_name }}
          path: ${{ env.TF_WORKING_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify plan artifact
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          EXPECTED_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          EXPECTED_SHA: ${{ needs.resolve-context.outputs.checkout_ref }}
        run: |
          set -euo pipefail

          test -f tfplan
          test -f tfplan.sha256
          test -f tfplan.metadata

          sha256sum -c tfplan.sha256

          PLAN_ENVIRONMENT="$(grep '^environment=' tfplan.metadata | cut -d= -f2)"
          PLAN_SHA="$(grep '^commit_sha=' tfplan.metadata | cut -d= -f2)"

          if [[ "${PLAN_ENVIRONMENT}" != "${EXPECTED_ENVIRONMENT}" ]]; then
            echo "::error::Plan environment mismatch."
            echo "::error::Expected ${EXPECTED_ENVIRONMENT}, received ${PLAN_ENVIRONMENT}."
            exit 1
          fi

          if [[ "${PLAN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Plan commit mismatch."
            echo "::error::Expected ${EXPECTED_SHA}, received ${PLAN_SHA}."
            exit 1
          fi

          echo "Plan checksum, environment and commit verified."

      - name: Display saved Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      - name: Apply saved Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan